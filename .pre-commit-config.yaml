# Pasang sekali:  uv run pre-commit install
# Jalankan semua: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      # Pemindai rahasia. Security v1.1 I1 / ST-19.
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy dijalankan dari venv proyek, bukan dari repo mirror.
  #
  # Hook mirror memasang environment sendiri, jadi ia butuh web3, psycopg, dan
  # mcp disebut ulang di `additional_dependencies` — daftar kedua yang akan
  # menyimpang dari uv.lock tanpa ada yang menyadarinya. Memakai venv proyek
  # menjaga satu sumber kebenaran. `--no-sync` dipakai supaya hook tidak pernah
  # memasang ulang .venv di tengah sesi.
  #
  # Daftar modulnya eksplisit: hanya berkas yang memang sudah bersih di bawah
  # --strict yang dijaga, supaya hook ini menolak regresi alih-alih mengeluh
  # tentang hal yang belum pernah rapi.
  #
  # `scripts/devnet_up.py` masuk daftar, `scripts/generate_schema_doc.py`
  # TIDAK. Alasannya aturan yang sama, bukan selera: yang pertama sudah bersih
  # di bawah --strict, yang kedua memuat 10 error dari satu akar di baris 183
  # (sebuah variabel `str` dipakai ulang untuk menampung `Table`). Merapikannya
  # butuh pembacaan supaya keluaran `docs/schema.md` tidak berubah, dan itu
  # utang yang terpisah. Memasukkannya sekarang akan membuat hook ini mengeluh
  # tentang hal yang belum pernah rapi -- persis yang dihindari aturan di atas.
  # Jangan tambahkan `scripts/` sebagai direktori; tambahkan berkas satu per
  # satu setelah berkasnya benar-benar bersih.
  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy --strict (uang, aturan, jalur eksekusi, agent demo, eval, dan skrip devnet)
        entry: uv run --no-sync mypy --strict
        language: system
        pass_filenames: false
        files: ^(src/payment_guard/.*\.py|evals/.*\.py|scripts/devnet_up\.py)$
        args:
          - src/payment_guard/money.py
          - src/payment_guard/addresses.py
          - src/payment_guard/rules.py
          - src/payment_guard/chain.py
          - src/payment_guard/decision_service.py
          - src/payment_guard/executor.py
          - src/payment_guard/approvals_cli.py
          - src/payment_guard/watcher.py
          - src/payment_guard/reconciler.py
          - src/payment_guard/demo_agent.py
          - evals/
          - scripts/devnet_up.py

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
