# Postgres 16 untuk pengembangan dan tes integrasi Payment Guard.
#
# `name` dipasang supaya container, jaringan, dan volume project ini tidak
# tercampur dengan project lain di mesin yang sama.
name: payment-guard

services:
  postgres:
    # Versi dipin. Jangan pakai `latest`: tes hak akses bergantung pada
    # perilaku GRANT/REVOKE Postgres 16.
    image: postgres:16.10-alpine
    container_name: payment-guard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_guard
      POSTGRES_USER: guard_admin
      # Hanya database pengembangan lokal yang terikat ke 127.0.0.1.
      # Password ini bukan rahasia produksi; tidak ada di jalur mana pun yang
      # menghadap jaringan. Lihat Security v1.1 asumsi 5.
      POSTGRES_PASSWORD: devonly_not_a_secret
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Host 5434: 5432 dan 5433 sudah dipakai project lain di mesin ini.
      # Bind ke 127.0.0.1 saja — Postgres tidak boleh terjangkau dari jaringan.
      - "127.0.0.1:5434:5432"
    volumes:
      # Volume bernama eksplisit. SKEMA TIDAK dimuat lewat
      # docker-entrypoint-initdb.d: skema hanya lewat `guard db migrate`,
      # supaya schema_migrations selalu mencerminkan keadaan nyata.
      - payment-guard-pgdata:/var/lib/postgresql/data
    # log_statement=none supaya CREATE ROLE / ALTER ROLE yang memuat password
    # tidak pernah masuk log server (Security v1.1 I2).
    #
    # lock_timeout dan statement_timeout dipasang per transaksi di kode
    # (Arsitektur v1.1 bagian 4), bukan server-wide: setelan server-wide akan
    # ikut membatasi migrasi dan bootstrap yang justru butuh waktu lebih.
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_messages=warning"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard_admin -d payment_guard"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cluster KEDUA, khusus tes integrasi. Tidak pernah jalan secara bawaan:
  # ia berada di profile `test`, jadi `docker compose up -d` biasa tidak
  # menyentuhnya.
  #
  #     docker compose --profile test up -d postgres_test
  #
  # Alasannya satu insiden nyata. Harness tes membuat dan menghapus role, dan
  # role Postgres bersifat **cluster-wide**, bukan per database. Selama tes
  # berjalan di cluster yang sama dengan database operator, satu run tes bisa
  # menghapus role `*_app` atau menyetel ulang password-nya, dan `.env`
  # operator berhenti cocok. Itu sudah terjadi.
  #
  # Dua cluster membuat kelas kesalahan itu hilang, bukan berkurang. Harness
  # juga menolak URL yang nama databasenya tidak berakhiran `_test` atau yang
  # portnya 5434; lihat `tests/integration/conftest.py`.
  postgres_test:
    profiles: ["test"]
    image: postgres:16.10-alpine
    container_name: payment-guard-postgres-test
    # Tanpa `restart`: cluster tes tidak perlu hidup di luar sesi tes.
    environment:
      POSTGRES_DB: payment_guard_test
      POSTGRES_USER: guard_admin
      POSTGRES_PASSWORD: devonly_not_a_secret
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Host 5435. BUKAN 5434: port itu milik cluster operator, dan harness
      # tes menolaknya secara eksplisit.
      - "127.0.0.1:5435:5432"
    volumes:
      - payment-guard-pgdata-test:/var/lib/postgresql/data
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_messages=warning"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard_admin -d payment_guard_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- DEVNET LOKAL ---------------------------------------------------------
  #
  # Chain lokal sekali pakai untuk membuktikan alur lengkap tanpa testnet
  # publik. Profile `devnet`, jadi `docker compose up -d` biasa tidak
  # menyentuhnya:
  #
  #     docker compose --profile devnet up -d anvil postgres_devnet
  #
  # Ini **devnet lokal**, bukan testnet. Chain id 31337, dan tidak ada
  # hubungannya dengan Base Sepolia (84532).
  #
  # KUNCI DEFAULT ANVIL ADALAH PUBLIK. Mnemonic bawaannya diterbitkan di
  # dokumentasi Foundry dan dipakai setiap pengembang di dunia. Jangan pernah
  # memakainya di jaringan sungguhan, termasuk testnet publik: alamat-alamat
  # itu dikuras bot dalam hitungan detik. Lihat docs/devnet.md.
  anvil:
    profiles: ["devnet"]
    # Versi dipin ke satu commit, bukan `latest` dan bukan `nightly`.
    # Foundry tidak lagi merilis tag semver stabil; yang ada hanya nightly
    # bernama commit, jadi commit itulah pinnya.
    #
    #   anvil/forge 1.9.1-nightly
    #   commit      cd3767105be7fa27eae63743c26359cefa0214fb
    #   digest      sha256:d41b25e26c3b63f415a0e425115f57ac372299902cdeeaf521ecd6cf595bab0b
    #
    # Versi dan digest itu juga ditulis di docs/devnet.md, dan ada tes yang
    # menjaga keduanya tidak menyimpang.
    image: ghcr.io/foundry-rs/foundry:nightly-cd3767105be7fa27eae63743c26359cefa0214fb
    container_name: payment-guard-anvil
    # Tanpa `restart`: devnet tidak perlu hidup di luar sesi devnet, dan
    # state-nya memang sekali pakai.
    #
    # `entrypoint` WAJIB di-override. ENTRYPOINT image ini adalah
    # ["/bin/sh","-c"], jadi `command: ["anvil", "--host", "0.0.0.0"]` membuat
    # hanya "anvil" menjadi skrip `-c` dan **seluruh flag sesudahnya hilang
    # tanpa pesan error** — anvil lalu mendengar di 127.0.0.1 di dalam
    # container, docker-proxy menerima koneksi, dan setiap permintaan RPC mati
    # dengan "Remote end closed connection". Itu sudah terjadi sekali saat
    # bagian ini dibangun.
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--chain-id"
      - "31337"
    ports:
      # Host 8545. Bukan 5434 (operator), bukan 5435 (tes), bukan 5436
      # (Postgres devnet), dan bukan 3000/8000/5433/6380 yang dipakai project
      # lain di mesin ini. Bind 127.0.0.1 saja.
      - "127.0.0.1:8545:8545"
    healthcheck:
      # `cast` ada di image yang sama. Chain id dibandingkan apa adanya:
      # 0x7a69 = 31337.
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 | grep -qx 31337"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cluster KETIGA, khusus devnet lokal. Terpisah dari cluster operator (5434)
  # dan cluster tes (5435) karena alasan yang sama seperti postgres_test: role
  # Postgres bersifat cluster-wide, dan skrip devnet membuat serta menghapus
  # role. Devnet tidak boleh bisa merusak `.env` operator.
  postgres_devnet:
    profiles: ["devnet"]
    image: postgres:16.10-alpine
    container_name: payment-guard-postgres-devnet
    environment:
      POSTGRES_DB: payment_guard_devnet
      POSTGRES_USER: guard_admin
      POSTGRES_PASSWORD: devonly_not_a_secret
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Host 5436. BUKAN 5434 (operator) dan BUKAN 5435 (tes).
      - "127.0.0.1:5436:5432"
    volumes:
      - payment-guard-pgdata-devnet:/var/lib/postgresql/data
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_messages=warning"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard_admin -d payment_guard_devnet"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  payment-guard-pgdata:
    name: payment-guard-pgdata
  payment-guard-pgdata-test:
    name: payment-guard-pgdata-test
  payment-guard-pgdata-devnet:
    name: payment-guard-pgdata-devnet
