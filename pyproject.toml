[project]
name = "payment-guard"
version = "0.1.0"
description = "Testnet-only reference implementation: deterministic mandate enforcement for agent payments."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    # Dipakai mulai M2 (signing Ed25519). Dipin sekarang supaya lockfile stabil.
    "cryptography>=43,<47",
    # Keccak-256 untuk Ethereum (M1, M5). hashlib hanya punya SHA3-256 yang
    # distandarkan NIST, yang padding-nya berbeda. Lihat payment_guard.hashing.
    "pycryptodome>=3.21,<4",
    # MCP server resmi (FastMCP, transport stdio) untuk Guard di M3.
    "mcp>=1.2,<2",
    "web3>=7.6,<8",
]

[project.scripts]
guard = "payment_guard.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payment_guard"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: butuh Postgres dari docker compose project payment-guard (port 5434)",
]
filterwarnings = [
    "error",
    # `import web3` ikut memuat provider websocket lama, dan websockets >= 14
    # memperingatkan deprecation di tingkat modul. Tidak ada kode di repo ini
    # yang memanggilnya: Executor memakai HTTPProvider (lihat RPC_URL_SCHEMES
    # di config.py), dan peringatannya muncul hanya karena rantai impor web3.
    #
    # Filter ini SENGAJA cocok dengan satu pesan saja, bukan dengan
    # DeprecationWarning secara umum: deprecation lain, milik kita maupun milik
    # pustaka lain, harus tetap menggagalkan tes.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint.isort]
# Pembantu tes yang hidup di `tests/` diimpor dengan nama datar (`fake_chain`,
# `conftest`, ...). Tanpa baris ini ruff menggolongkannya sebagai pustaka pihak
# ketiga dan mengurutkannya bersama paket eksternal.
known-first-party = [
    "payment_guard",
    "fake_chain",
    "conftest",
    "conftest_guard",
    "conftest_executor",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (termasuk S608: SQL dirakit string)
    "RUF",
]
ignore = [
    "S101",  # assert diizinkan di tes
]

[tool.ruff.lint.per-file-ignores]
# Pelonggaran ini HANYA untuk tes, tidak pernah untuk src/:
#   S105/S106  password palsu sebagai data uji (canary kebocoran)
#   S608       tes hak akses menyusun DDL/GRANT dari nama objek yang sudah
#              divalidasi daftar-izin; ditinjau manual
#   S104/S108  "0.0.0.0" dan "/tmp" muncul sebagai nama host yang justru
#              sedang diuji penolakannya, bukan sebagai bind atau path nyata
"tests/**" = ["S104", "S105", "S106", "S108", "S608"]
