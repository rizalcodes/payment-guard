[project]
name = "payment-guard"
version = "0.1.0"
description = "Testnet-only reference implementation: deterministic mandate enforcement for agent payments."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    # Dipakai mulai M2 (signing Ed25519). Dipin sekarang supaya lockfile stabil.
    "cryptography>=50,<51",
    # Keccak-256 untuk Ethereum (M1, M5). hashlib hanya punya SHA3-256 yang
    # distandarkan NIST, yang padding-nya berbeda. Lihat payment_guard.hashing.
    "pycryptodome>=3.21,<4",
    # MCP server resmi (FastMCP, transport stdio) untuk Guard di M3.
    "mcp>=1.2,<2",
    "web3>=7.6,<8",
]

[project.scripts]
guard = "payment_guard.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=4.7.0",
    "pytest>=8.3,<9",
    "pyyaml>=6,<7",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payment_guard"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tes `live` menyentuh chain sungguhan dan membelanjakan gas. Dilewati secara
# bawaan, dan membukanya butuh dua hal sekaligus: `-m live` di baris perintah
# DAN PAYMENT_GUARD_LIVE=1 di environment. Lihat tests/integration/test_live.py.
addopts = ["-m", "not live"]
markers = [
    "integration: butuh Postgres dari compose profile `test` (port 5435, database *_test)",
    "live: menyentuh Base Sepolia sungguhan dan membelanjakan gas; dilewati secara bawaan",
]
filterwarnings = [
    "error",
    # `import web3` ikut memuat provider websocket lama, dan websockets >= 14
    # memperingatkan deprecation di tingkat modul. Tidak ada kode di repo ini
    # yang memanggilnya: Executor memakai HTTPProvider (lihat RPC_URL_SCHEMES
    # di config.py), dan peringatannya muncul hanya karena rantai impor web3.
    #
    # Empat bagian, dan keempatnya menyempit: aksi, pesan, kategori, dan
    # **modul asal**. Tanpa bagian keempat, deprecation mana pun yang kebetulan
    # berbunyi sama akan ikut dibisukan. Deprecation lain — milik kita maupun
    # milik pustaka lain — tetap menggagalkan tes.
    'ignore:websockets\.legacy is deprecated:DeprecationWarning:websockets\.legacy',
]

[tool.mypy]
python_version = "3.12"
# `--strict` disetel di baris perintah dan di pre-commit untuk daftar modul yang
# memang sudah bersih (lihat .pre-commit-config.yaml). Ia sudah mencakup
# warn_unused_ignores, warn_redundant_casts, dan no_implicit_reexport, jadi
# tidak diulang di sini.
#
# `warn_unreachable` SENGAJA TIDAK dipakai, dan ini bukan kelalaian.
#
# Kode ini memeriksa tipe saat **runtime** di setiap batas sistem: baris
# database, payload JSON, dan argumen tool datang tanpa tipe, dan anotasi
# Python terhapus saat program berjalan. Penjaga seperti
# `isinstance(value, bool)` pada parameter yang dianotasi `str` atau
# `BaseUnits` secara statik memang tidak terjangkau — tapi justru itu yang
# menangkap `True` yang datang dari JSON, dan ada tes yang menuntutnya tetap
# menangkapnya. Menyalakan warn_unreachable berarti memilih antara membuang
# penjaga yang bekerja atau menaburkan `type: ignore`; keduanya lebih buruk
# daripada tidak menyalakannya.
show_error_codes = true

[[tool.mypy.overrides]]
# Paket ini tidak mengirim anotasi yang lengkap. Kami tidak memeriksa isinya;
# yang diperiksa adalah kode kami yang memanggilnya.
module = ["eth_account.*", "Crypto.*", "mcp.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint.isort]
# Pembantu tes yang hidup di `tests/` diimpor dengan nama datar (`fake_chain`,
# `conftest`, ...). Tanpa baris ini ruff menggolongkannya sebagai pustaka pihak
# ketiga dan mengurutkannya bersama paket eksternal.
known-first-party = [
    "payment_guard",
    "fake_chain",
    "conftest",
    "conftest_guard",
    "conftest_executor",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (termasuk S608: SQL dirakit string)
    "RUF",
]
ignore = [
    "S101",  # assert diizinkan di tes
]

[tool.ruff.lint.per-file-ignores]
# Pelonggaran ini HANYA untuk tes, tidak pernah untuk src/:
#   S105/S106  password palsu sebagai data uji (canary kebocoran)
#   S608       tes hak akses menyusun DDL/GRANT dari nama objek yang sudah
#              divalidasi daftar-izin; ditinjau manual
#   S104/S108  "0.0.0.0" dan "/tmp" muncul sebagai nama host yang justru
#              sedang diuji penolakannya, bukan sebagai bind atau path nyata
"tests/**" = ["S104", "S105", "S106", "S108", "S608"]
